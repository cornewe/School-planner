<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Planner</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#182230;--muted:#697386;--line:#e3e7ef;--blue:#315efb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1250px;margin:auto;padding:22px 16px 45px}
header{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px;flex-wrap:wrap}
h1{margin:0;font-size:30px} .subtitle{color:var(--muted);margin:4px 0 0}
.controls{display:flex;gap:10px;flex-wrap:wrap}
select,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white}
button{font-weight:700;cursor:pointer} button:hover{background:#eef2ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 20px rgba(25,35,55,.06)}
.card-head{padding:15px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px;display:flex;justify-content:space-between}
.card-head small{font-weight:500;color:var(--muted);font-size:12px}
.task{padding:13px 15px;border-bottom:1px solid #edf0f5;display:flex;gap:11px}
.task:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:#315efb}
.task h3{font-size:14px;margin:0 0 3px} .task p{font-size:13px;color:var(--muted);margin:0}
.empty{padding:25px;color:var(--muted);text-align:center}
.badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#315efb;font-size:11px;font-weight:700}
.calendar{margin-top:18px;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cal-title{padding:15px 16px;font-weight:800;border-bottom:1px solid var(--line)}
.month{display:grid;grid-template-columns:repeat(7,1fr)}
.weekday{padding:9px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);background:#fafbfe;border-bottom:1px solid var(--line)}
.day{min-height:92px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}
.day:nth-child(7n){border-right:0} .num{font-weight:800;color:var(--muted)}
.event{margin-top:5px;padding:5px 6px;border-radius:6px;background:#eef2ff;color:#253b8f;line-height:1.25}
@media(max-width:850px){.grid{grid-template-columns:1fr}.month{min-width:700px}.calendar{overflow:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>School Planner</h1><div class="subtitle">Tasks, deadlines and holidays at a glance</div></div>
<div class="controls">
<select id="subject"></select><select id="month"></select><button onclick="resetAll()">Reset</button>
</div>
</header>
<section class="grid" id="columns"></section>
<section class="calendar">
<div class="cal-title" id="calTitle">Calendar</div>
<div class="month" id="calendar"></div>
</section>

const subjects=[...new Set(data.map(x=>x.subject).filter(Boolean))].sort();
const subject=document.getElementById('subject'), month=document.getElementById('month');
subject.innerHTML='<option value="">All subjects</option>'+subjects.map(x=>`<option>${esc(x)}</option>`).join('');
const months=[...new Set(data.map(x=>x.date.slice(0,7)).filter(Boolean))].sort();
month.innerHTML='<option value="">All months</option>'+months.map(x=>`<option value="${x}">${monthName(x)}</option>`).join('');
subject.onchange=render; month.onchange=render;

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthName(x){let [y,m]=x.split('-');return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function filtered(){return data.filter(x=>(!subject.value||x.subject===subject.value)&&(!month.value||x.date.startsWith(month.value)))}
function render(){
 let d=filtered();
 let groups={};
 d.filter(x=>x.date).forEach(x=>(groups[x.subject]??=[]).push(x));
 let keys=Object.keys(groups).sort();
 document.getElementById('columns').innerHTML=keys.length?keys.slice(0,3).map(k=>`
 <div class="card"><div class="card-head">${esc(k)} <small>${groups[k].length} item(s)</small></div>
 ${groups[k].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="task"><span class="dot"></span><div><h3>${esc(x.task||'No task specified')}</h3><p>${esc(x.dateDisplay)}${x.subject==='Holidays'?' <span class="badge">Holiday</span>':''}</p></div></div>`).join('')}

}
function renderCalendar(d){
 let target=month.value||months[0]; if(!target){document.getElementById('calendar').innerHTML='';return}
 let [y,m]=target.split('-').map(Number), first=new Date(y,m-1,1), days=new Date(y,m,0).getDate(), start=(first.getDay()+6)%7;

 let out=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('');
 for(let i=0;i<start;i++)out+='<div class="day"></div>';
